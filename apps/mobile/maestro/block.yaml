# W2.10 exit audit · block a member (docs/spec/21 §4; docs/spec/09 W2.6): a
# member blocks an author from their testimony's detail screen, and that
# author's content disappears from the feed both ways.
#
# Run against a FRESH local database and a running dev build + Metro:
#   pnpm db:reset
#   maestro test -e APP_URL=<dev-client deep link> \
#     -e REVIEW_EMAIL=<from functions/.env> -e REVIEW_CODE=<same> \
#     apps/mobile/maestro/block.yaml
appId: com.oami.agbcapp
---
# A cleared dev client lands on the Expo launcher, not the app; clearState wipes
# the guest's data and openLink then deep-links a fresh bundle. On a release build
# APP_URL is the plain app scheme and this is just a clean launch into onboarding.
- clearState
- openLink: '${APP_URL}'
- extendedWaitUntil:
    visible: "I'm just looking"
    timeout: 60000
- tapOn: "I'm just looking"
- extendedWaitUntil:
    visible: 'Help us make this better?'
    timeout: 10000
- tapOn: 'No thanks'

- tapOn: 'More'
- tapOn: 'Sign in'
- runFlow: subflows/signin-review.yaml

- tapOn: 'Family'
# The seeded Glasgow testimony, into its detail screen.
- tapOn: 'The surgery went perfectly.*'
- tapOn: 'Post actions'
# The actions sheet animates up; wait for it before reaching for a row.
- extendedWaitUntil:
    visible: 'Block this member'
    timeout: 10000
- tapOn: 'Block this member'
# The confirm sheet's button carries the name without the title's question mark,
# so the two are distinct full-string matches. Wait for it to animate in too.
- extendedWaitUntil:
    visible: 'Block Tobi Adewale'
    timeout: 10000
- tapOn: 'Block Tobi Adewale'

# Blocking from the detail leaves the screen (there is nothing left to see) and
# the author's content is gone from the feed.
- extendedWaitUntil:
    visible: 'Everywhere'
    timeout: 15000
- assertNotVisible: 'The surgery went perfectly.*'
