# W2.10 exit audit · OTP sign-in journey (docs/spec/21 §4, docs/spec/18 Phase 2
# exit): a guest signs in with the review email through AUTH-1..4 and lands back
# where they started, a member.
#
# Run against a FRESH local database and a running dev build + Metro:
#   pnpm db:reset
#   maestro test -e APP_URL=<dev-client deep link> \
#     -e REVIEW_EMAIL=<from functions/.env> -e REVIEW_CODE=<same> \
#     apps/mobile/maestro/otp-signin.yaml
#
# CI: nightly.yml `workflow_dispatch` only (CI budget rule; see guest-smoke).
appId: com.oami.agbcapp
---
# A cleared dev client lands on the Expo launcher, not the app; clearState wipes
# the guest's data and openLink then deep-links a fresh bundle. On a release build
# APP_URL is the plain app scheme and this is just a clean launch into onboarding.
- clearState
- openLink: '${APP_URL}'
- extendedWaitUntil:
    visible: "I'm just looking"
    timeout: 60000
- tapOn: "I'm just looking"

# First Home after onboarding: the analytics ask (W2.10 slice 1) always appears
# on a cleared state. The journey declines it: an E2E device is not a member.
- extendedWaitUntil:
    visible: 'Help us make this better?'
    timeout: 10000
- tapOn: 'No thanks'

- tapOn: 'More'
- tapOn: 'Sign in'
- runFlow: subflows/signin-review.yaml

# Prove membership on a surface that actually reflects auth state. The More hub
# is a guest-only variant (its join card and the "My Library · Sign in" badge are
# rendered unconditionally; the member "My life" section is unbuilt), so it is
# NOT a membership signal. Settings is auth-reactive: the "Profile" row (and the
# "Sign out" button) appear only for a signed-in member (settings/index.tsx).
- tapOn: 'More'
- scrollUntilVisible:
    element:
      text: 'Settings'
- tapOn: 'Settings'
- assertVisible: 'Profile'
