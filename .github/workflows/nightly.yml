name: Nightly

# NO cron yet, deliberately: Actions minutes are a shared pool across all of Ayo's
# private repos, and a nightly Android-emulator run is NOT zero-cost (project
# CLAUDE.md CI budget rule). The guest-smoke job below runs on workflow_dispatch
# ONLY. Its cron cadence is a budget decision made when an APK-build source is
# wired into CI so the job can produce its own binary (other nightly jobs still
# arrive with their work items: pseudo-localization at W4.6, off-provider prod dump
# at Track P1; docs/spec/21 §3).
on:
  workflow_dispatch:
    inputs:
      app_binary_url:
        description: 'URL of an Android .apk to smoke-test (e.g. an EAS build artifact URL)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  guest-smoke:
    # W1.8 Maestro guest browse journey (docs/spec/25 · docs/spec/18 Phase 1 exit):
    # Home > Watch > Family > Give bank details, with no account and no dead ends.
    # Needs an APK: pass its URL as the input until the EAS-build-in-CI pipeline
    # lands and can produce one automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download app binary
        run: curl -fL -o app.apk "${{ inputs.app_binary_url }}"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run the guest smoke journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app.apk
            maestro test apps/mobile/maestro/guest-smoke.yaml
