name: PR

# Top-level paths filter: docs-only PRs (the most common kind in this repo) start ZERO
# jobs and cost zero shared Actions minutes.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'

# Supersede older runs of the same PR (devops standard: CI cost hygiene).
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; no job here needs more.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pr.yml'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pr.yml'
            supabase:
              - 'supabase/**'
              - '.github/workflows/pr.yml'

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile typecheck
      - run: pnpm --filter mobile lint
      - run: pnpm --filter mobile test
      # Advisory, not a gate (decided 2026-07-23). expo-doctor's version-match
      # check fails whenever Expo ships a release, which is outside our control and
      # would red-block every PR on the calendar rather than on its diff. Renovate
      # owns version freshness on its cooldown (21 §3), so this runs for visibility
      # (config/plugin issues still surface as annotations) but never fails the job.
      - run: npx expo-doctor
        working-directory: apps/mobile
        continue-on-error: true

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dashboard typecheck
      - run: pnpm --filter dashboard lint
      # The dashboard's tests mint REAL sessions (docs/spec/17 authz, W2.7): a leader
      # who cannot touch another branch is proven against real JWTs and real profiles
      # rows, not against a mock of Supabase. That needs Auth, so this job runs the
      # local stack rather than the db-only start the supabase job uses. Everything the
      # tests do not touch is excluded to keep the shared Actions minutes down, and the
      # whole job still costs zero unless a PR changes apps/dashboard, packages, or the
      # lockfile. The tests read the connection details from `supabase status`, so no
      # keys are exported into the job environment.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0
      - run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector
      - run: pnpm --filter dashboard test
      - run: pnpm --filter dashboard build

  supabase:
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0
      # db-only start (not the full `supabase start`): pgTAP, drift, and fence checks need
      # only Postgres, and skipping the auth/storage/studio images saves minutes per run.
      # Applies the FULL migration history + seeds to a fresh database (docs/spec/23 §3a).
      - run: supabase db start
      - run: supabase test db
      # Types-drift gate: armed automatically when W0.10 commits the first generated file.
      - name: types drift
        run: |
          if [ -f packages/shared/src/database.types.ts ]; then
            supabase gen types typescript --local > /tmp/database.types.ts
            diff -u packages/shared/src/database.types.ts /tmp/database.types.ts
          else
            echo "no committed database.types.ts yet (arrives at W0.10); skipping"
          fi
      # The fence-guard that stood here until 2026-08-17 is GONE, with its subject
      # (ADR 0023). It greped migrations for `donations` and friends because those
      # objects lived in a project we shared with the live website and could only
      # damage. Production is now a project of our own, `donations` is created by our
      # own history (20260817120000), and a rule that forbids naming it would forbid
      # the migration that makes the website work.
      #
      # What replaced it is not weaker, it is the opposite: the risk was never the
      # NAME, it was the SHAPE, since another repo's Stripe webhook inserts into two
      # of these tables with no compile step between us. A grep cannot see a retyped
      # or newly-NOT-NULL column. `supabase test db` above can, and does:
      # supabase/tests/039 asserts the shape contract for BOTH shared tables, which
      # is more than the fence ever covered (course_registrations was never on it).

      # Edge-function tests (W1.3+): pure logic + shared zod contracts, no network.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Explicit --config so the import map also governs the shared contract
      # imports (bare "zod" from packages/shared) without a node_modules install.
      - run: deno test --allow-net=none --config supabase/functions/deno.json supabase/functions
